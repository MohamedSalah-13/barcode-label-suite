name: build

# A pull request, and a push to master. A push to any other branch starts nothing: it used to, so
# every push to a pull request's branch ran this twice on the same commit, once as the push and once
# as the pull request. The repository is private and the runner is Windows, whose minute is billed
# at more than a Linux one, out of the 2,000 a month the account has for all its repositories.
on:
  push:
    branches: [ master ]
  pull_request:

# A new push to a pull request cancels its run still going. Pushes to master never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: windows-latest
    # About five minutes as a rule. Without a limit a job that hangs runs for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify base modules
        shell: pwsh
        run: .\mvnw.cmd clean install

      - name: Verify rendering modules
        shell: pwsh
        run: .\mvnw.cmd -f phase2-pom.xml clean install

      - name: Install phase 3 parent descriptors
        shell: pwsh
        run: |
          .\mvnw.cmd -N -f phase3-pom.xml install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mvnw.cmd -N -f phase3-build-pom.xml install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify printing and designer modules
        shell: pwsh
        run: |
          .\mvnw.cmd -f phase3-final-pom.xml clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mvnw.cmd -f phase4-final-pom.xml clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify workflow and final application
        shell: pwsh
        run: |
          .\mvnw.cmd -f phase5-pom.xml -pl barcode-label-workflow -am clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mvnw.cmd -f phase5-fixed-pom.xml clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mvnw.cmd -f phase6-final-pom.xml clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows application image
        shell: pwsh
        run: .\package-phase6.ps1 -SkipBuild

      - name: Upload application and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: barcode-label-suite-windows
          path: |
            dist/BarcodeLabelSuite
            **/target/site/jacoco
