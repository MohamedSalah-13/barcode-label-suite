name: build

# A pull request, and a push to master. A push to any other branch starts nothing, so a push to a
# pull request's branch is built once, as the pull request, rather than twice on the same commit.
on:
  push:
    branches: [ master ]
  pull_request:

# The workflow only reads the repository. Keeping the token read-only matters for a public
# repository, where anyone can open a pull request that runs this workflow.
permissions:
  contents: read

# A new push to a pull request cancels its run still going. Pushes to master never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (windows)
    runs-on: windows-latest
    # About five minutes as a rule. Without a limit a job that hangs runs for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # package.ps1 imports desktop-updater's tools/Packaging.psm1, pinned to a commit so nothing changes
      # here without a pull request in this repository. Inside the workspace, after this repository's own
      # checkout, which would clean it away.
      - name: Check out desktop-updater's packaging module
        uses: actions/checkout@v4
        with:
          repository: MohamedSalah-13/desktop-updater
          ref: 2a6177177e6cf275f0d79986a70e41037a13e6bf
          path: .desktop-updater

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test all modules
        shell: pwsh
        run: .\mvnw.cmd -B clean install

      - name: Package Windows application image
        shell: pwsh
        env:
          DESKTOP_UPDATER_HOME: ${{ github.workspace }}/.desktop-updater
        run: .\package.ps1 -SkipBuild

      - name: Upload application and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: barcode-label-suite-windows
          path: |
            dist/BarcodeLabelSuite
            **/target/site/jacoco

  # The same build on Linux, so the library is known to build outside Windows. The JavaFX UI
  # tests need a display, which xvfb provides on the headless runner.
  verify-linux:
    name: verify (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install a virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Build and test all modules
        run: xvfb-run -a ./mvnw -B clean install
