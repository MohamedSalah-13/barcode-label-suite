name: build

# A pull request, and a push to master. A push to any other branch starts nothing, so a push to a
# pull request's branch is built once, as the pull request, rather than twice on the same commit.
on:
  push:
    branches: [ master ]
  pull_request:

# The workflow only reads the repository. Keeping the token read-only matters for a public
# repository, where anyone can open a pull request that runs this workflow.
permissions:
  contents: read

# A new push to a pull request cancels its run still going. Pushes to master never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (windows)
    runs-on: windows-latest
    # About five minutes as a rule. Without a limit a job that hangs runs for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify base modules
        shell: pwsh
        run: .\mvnw.cmd clean install

      - name: Verify rendering modules
        shell: pwsh
        run: .\mvnw.cmd -f phase2-pom.xml clean install

      - name: Install phase 3 parent descriptors
        shell: pwsh
        run: |
          .\mvnw.cmd -N -f phase3-pom.xml install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mvnw.cmd -N -f phase3-build-pom.xml install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify printing and designer modules
        shell: pwsh
        run: |
          .\mvnw.cmd -f phase3-final-pom.xml clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mvnw.cmd -f phase4-final-pom.xml clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify workflow and final application
        shell: pwsh
        run: |
          .\mvnw.cmd -f phase5-pom.xml -pl barcode-label-workflow -am clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mvnw.cmd -f phase5-fixed-pom.xml clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mvnw.cmd -f phase6-final-pom.xml clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows application image
        shell: pwsh
        run: .\package-phase6.ps1 -SkipBuild

      - name: Upload application and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: barcode-label-suite-windows
          path: |
            dist/BarcodeLabelSuite
            **/target/site/jacoco

  # The same verification on Linux, so the library is known to build outside Windows. The JavaFX UI
  # tests need a display, which xvfb provides on the headless runner.
  verify-linux:
    name: verify (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install a virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Verify all phases
        run: xvfb-run -a ./verify-phase6.sh
