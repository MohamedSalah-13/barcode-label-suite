name: release

# Pushing a tag such as v0.7.0 builds, tests and packages the Windows application and publishes it as a
# GitHub release, with that version's CHANGELOG.md section as the notes. To release:
#   1. set the version in the root pom.xml (every module inherits it) and add its CHANGELOG.md section;
#   2. merge that to master;
#   3. git tag v<version> on that commit and push the tag.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (for example v0.9.0)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# Serialize publishing attempts for the same version, including manual retries.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Creating the release needs write access to the repository's contents; nothing else.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check the tag matches the project version and has release notes
        shell: bash
        run: |
          version=$(scripts/project-version.sh)
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match the version in pom.xml ($version)"
            exit 1
          fi
          scripts/release-notes.sh "$version" > release-notes.md
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test all modules
        shell: pwsh
        run: .\mvnw.cmd -B clean install

      - name: Package the Windows application
        shell: pwsh
        run: .\package.ps1 -SkipBuild

      - name: Zip the application
        shell: pwsh
        run: Compress-Archive -Path dist/BarcodeLabelSuite -DestinationPath "dist/BarcodeLabelSuite-$env:VERSION-windows.zip"

      - name: Zip the calibration templates
        shell: pwsh
        run: Compress-Archive -Path calibration-templates -DestinationPath "dist/BarcodeLabelSuite-$env:VERSION-calibration-templates.zip"

      # jpackage on JDK 21 builds .exe installers with WiX 3, which newer runner images may not carry.
      - name: Make sure WiX 3 is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) {
              choco install wixtoolset --no-progress -y
              $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Select-Object -First 1
            }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $wix.FullName 'bin')
          }

      # The installer is what installed copies download to update themselves: the app looks for a release
      # asset matching *-setup.exe, so keep that ending.
      - name: Build the Windows installer
        shell: pwsh
        run: |
          .\package.ps1 -SkipBuild -Type exe
          Move-Item "dist/BarcodeLabelSuite-$env:VERSION.exe" "dist/BarcodeLabelSuite-$env:VERSION-setup.exe"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "dist/BarcodeLabelSuite-$VERSION-setup.exe"
            "dist/BarcodeLabelSuite-$VERSION-windows.zip"
            "dist/BarcodeLabelSuite-$VERSION-calibration-templates.zip"
          )
          if gh release view "$RELEASE_TAG" > /dev/null; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "Barcode Label Suite $VERSION" \
              --notes-file release-notes.md
          fi
